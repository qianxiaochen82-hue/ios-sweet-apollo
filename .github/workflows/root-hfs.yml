name: root-hfs

# Minimal HFS+ root image for `rd=md0` (memory-disk root, no partition changes).
# The phone's userdata is not HFS+, so the root has to come from the payload.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/root-hfs.yml"

env:
  IMAGE_SIZE: 8m
  VOLUME: sweet

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create bare HFS+ image
        run: |
          set -eux
          # newfs_hfs formats a plain regular file: the result is a bare HFS+
          # volume (no UDIF trailer), which is what IOFindBSDRoot hands to md0.
          rm -f root-hfs.img
          dd if=/dev/zero of=root-hfs.img bs=1m count=8
          # newfs_hfs prepends /dev/ to relative paths, so hand it an absolute one.
          newfs_hfs -v "$VOLUME" "$PWD/root-hfs.img"
          hdiutil attach -nomount root-hfs.img > dev.txt
          cat dev.txt

      - name: Populate
        run: |
          set -eux
          DEV=$(awk 'NR==1{print $1}' dev.txt)
          mkdir -p /tmp/mnt
          mount -t hfs "$DEV" /tmp/mnt
          mkdir -p /tmp/mnt/dev /tmp/mnt/sbin /tmp/mnt/etc /tmp/mnt/tmp /tmp/mnt/var
          printf 'sweet root image (md0)\n' > /tmp/mnt/README.txt
          ls -la /tmp/mnt
          umount /tmp/mnt
          hdiutil detach "$DEV" || true

      - name: Verify
        run: |
          set -eux
          ls -l root-hfs.img
          # HFS+ volume header sits at offset 1024 and must start with 'H+'.
          dd if=root-hfs.img bs=1 skip=1024 count=2 | xxd

      - uses: actions/upload-artifact@v4
        with:
          name: root-hfs
          path: root-hfs.img
          retention-days: 30
